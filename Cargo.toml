[package]
name = "parton-sbi"
version = "0.1.0"
edition = "2021"
description = "Event-level DIS simulation and simulation-based inference research infrastructure for parton structure studies."
repository = "https://github.com/mirhanayd/parton-sbi"
default-run = "parton-sbi"

[features]
default = []
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
]

[dependencies]
candle-core = { version = "0.8.4", default-features = false }
candle-nn = { version = "0.8.4", default-features = false }
chrono = "0.4"
csv = "1.3"
managed-lhapdf = { version = "=0.4.2", default-features = false }
plotters = "0.3.7"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"
